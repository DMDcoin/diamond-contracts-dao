name: Solhint Analysis

on: [push, pull_request]

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.18.0]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.x.x
          cache: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: "Solhint: scan"
        id: solhint
        run: pnpm run solhint:ci
        continue-on-error: true

      - name: "Solhint: generate report"
        if: always()
        run: pnpm run solhint:sarif-report
        continue-on-error: true

      - name: "Solhint: publish report"
        if: always() && hashFiles('solhint_report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: solhint_report.sarif
          category: solhint

      - name: Fail on solhint findings
        if: steps.solhint.outcome != 'success'
        run: exit 1
